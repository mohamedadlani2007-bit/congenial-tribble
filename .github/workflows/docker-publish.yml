name: Build and publish Docker image

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build smoke-test image
        run: docker build --tag blessvless:smoke .
      - name: Start VLESS bot container
        run: |
          docker run --detach --name blessvless-smoke --publish 18080:8080 \
            --env VLESS_UUID=123e4567-e89b-12d3-a456-426614174000 \
            --env ADMIN_PASSWORD=test-only \
            blessvless:smoke
      - name: Verify Cloud Run listener and setup page
        run: |
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:18080/health >/dev/null && \
               curl --silent --fail http://127.0.0.1:18080/ | grep -q 'إعداد VLESS Bot'; then
              exit 0
            fi
            sleep 2
          done
          docker logs blessvless-smoke
          exit 1
      - name: Show logs on failure
        if: failure()
        run: docker logs blessvless-smoke
      - name: Remove smoke-test container
        if: always()
        run: docker rm --force blessvless-smoke || true

  docker:
    needs: smoke
    environment: DOCKERHUB_TOKEN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push blessvless
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/blessvless:v1
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/blessvless:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
