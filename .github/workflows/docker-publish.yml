name: Build and publish Docker image

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build smoke-test image
        run: docker build --tag blessvless:smoke .
      - name: Start VLESS bot container
        run: |
          docker run --detach --name blessvless-smoke --publish 18080:8080 \
            --env VLESS_UUID=123e4567-e89b-12d3-a456-426614174000 \
            --env ADMIN_PASSWORD=test-only \
            blessvless:smoke
      - name: Verify Cloud Run listener and setup page
        run: |
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:18080/health >/dev/null && \
               curl --silent --fail http://127.0.0.1:18080/ | grep -q 'إعداد VLESS Bot'; then
              break
            fi
            sleep 2
          done
          curl --silent --fail http://127.0.0.1:18080/health >/dev/null
          curl --silent --fail http://127.0.0.1:18080/ | grep -q 'إعداد VLESS Bot'

      - name: Verify Dark Tunnel and per-user UUID logic
        run: |
          python3 - <<'PY'
          import base64, json, os, sys
          sys.path.insert(0, '.')
          os.environ['DOMAIN'] = 'example.run.app'
          import bot
          user = {'uuid': 'b60151ba-c8a0-4005-9ded-a7bb9d5ce2ad', 'name': 'smoke', 'active': True}
          value = bot.dark_file(user)
          assert value.startswith('darktunnel://')
          payload = value.split('://', 1)[1]
          payload += '=' * ((4 - len(payload) % 4) % 4)
          decoded = json.loads(base64.urlsafe_b64decode(payload))
          v2ray = decoded['vlessTunnelConfig']['v2rayConfig']
          assert v2ray['uuid'] == user['uuid']
          assert v2ray['wsPath'] == '/_mohalamia'
          assert bot.menu()[0][0]['callback_data'] == 'create'
          print('Dark Tunnel, UUID, and buttons: OK')
          PY

      - name: Show logs on failure
        if: failure()
        run: docker logs blessvless-smoke
      - name: Remove smoke-test container
        if: always()
        run: docker rm --force blessvless-smoke || true

  docker:
    needs: smoke
    environment: DOCKERHUB_TOKEN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push blessvless
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/blessvless:v1
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/blessvless:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
